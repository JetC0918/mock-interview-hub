# Development-only legacy combined stack. Production deployment is Render
# via render.yaml; do not use this file as a production manifest.
# Uses a single container for frontend + backend

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: mock-interview-db
    environment:
      POSTGRES_USER: codiolive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: codiolive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U codiolive -d codiolive" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Combined Application (Frontend + Backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mock-interview-app
    environment:
      DATABASE_URL: postgresql://codiolive:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/codiolive
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      APP_ENV: production
      COOKIE_SECURE: "true"
      SEED_DEMO_DATA: "false"
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
