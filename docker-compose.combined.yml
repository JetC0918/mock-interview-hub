# Docker Compose for Combined Container Deployment
# Uses a single container for frontend + backend

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: mock-interview-db
    environment:
      POSTGRES_USER: codiolive
      POSTGRES_PASSWORD: codiolive_secret
      POSTGRES_DB: codiolive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U codiolive -d codiolive" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Combined Application (Frontend + Backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mock-interview-app
    environment:
      DATABASE_URL: postgresql://codiolive:codiolive_secret@db:5432/codiolive
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
