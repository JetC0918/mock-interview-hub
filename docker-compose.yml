services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: mock-interview-db
    environment:
      POSTGRES_USER: codiolive
      POSTGRES_PASSWORD: codiolive_secret
      POSTGRES_DB: codiolive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U codiolive -d codiolive" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mock-interview-backend
    environment:
      DATABASE_URL: postgresql://codiolive:codiolive_secret@db:5432/codiolive
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend with nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mock-interview-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
